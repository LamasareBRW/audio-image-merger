<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audio Image Merger</title>

<style>
body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 20px auto; padding: 12px; line-height: 1.5; }
input, button { width: 100%; margin: 8px 0; padding: 10px; font-size: 16px; box-sizing: border-box; }
button { background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
button:disabled { background: #999; cursor: not-allowed; }
#progress { width: 100%; height: 20px; margin: 10px 0; }
#log { white-space: pre-wrap; background: #f4f4f4; padding: 10px; margin-top: 10px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 14px; }
.download-link { display: inline-block; margin: 10px 0; padding: 12px 24px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
</style>
</head>
<body>

<h2>Audio + Image → Video</h2>

<input type="file" id="image" accept="image/*">
<input type="file" id="audio" accept="audio/*">

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
  <div><label>Start Time (s)</label><input type="number" id="start" value="0" min="0" step="0.1"></div>
  <div><label>Duration (s, optional)</label><input type="number" id="duration" placeholder="optional" min="0" step="0.1"></div>
</div>

<button id="run">Create Video</button>
<progress id="progress" value="0" max="1" style="display:none;"></progress>
<div id="log"></div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const logEl = document.getElementById("log");
const progressEl = document.getElementById("progress");
const runBtn = document.getElementById("run");

const log = (t) => { logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; };

const ffmpeg = new FFmpeg();
ffmpeg.on("log", ({ message }) => log(message));
ffmpeg.on("progress", ({ progress: p }) => { progressEl.value = p; });

// Register Service Worker for COOP/COEP headers
async function registerSW() {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js');
      log("✅ Service Worker registered");
    } catch (e) {
      log("⚠️ Service Worker registration failed (some browsers block it)");
    }
  }
}

async function loadFFmpeg() {
  log("Loading FFmpeg... (10-30s first time)");
  progressEl.style.display = "block";

  const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';

  const [coreURL, wasmURL, workerURL] = await Promise.all([
    toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
    toBlobURL(`${baseURL}/ffmpeg-core.worker.js`, 'text/javascript'),
  ]);

  await ffmpeg.load({ coreURL, wasmURL, workerURL });
  log("✅ FFmpeg loaded");
  progressEl.style.display = "none";
}

document.getElementById("run").onclick = async () => {
  const imgFile = document.getElementById("image").files[0];
  const audFile = document.getElementById("audio").files[0];
  const startTime = document.getElementById("start").value || "0";
  const duration = document.getElementById("duration").value;

  if (!imgFile || !audFile) return alert("Select image and audio");

  runBtn.disabled = true;
  logEl.textContent = "";

  try {
    await registerSW();
    await loadFFmpeg();

    const imgName = imgFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const audName = audFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');

    await ffmpeg.writeFile(imgName, await fetchFile(imgFile));
    await ffmpeg.writeFile(audName, await fetchFile(audFile));

    const args = ["-loop", "1", "-i", imgName, "-ss", startTime, "-i", audName,
      "-c:v", "libx264", "-tune", "stillimage", "-pix_fmt", "yuv420p",
      "-c:a", "aac", "-b:a", "192k", "-shortest"];

    if (duration && Number(duration) > 0) args.push("-t", String(duration));
    args.push("output.mp4");

    log("Processing...");
    await ffmpeg.exec(args);

    const data = await ffmpeg.readFile("output.mp4");
    const blob = new Blob([data.buffer], { type: "video/mp4" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url; link.download = "output.mp4"; link.textContent = "⬇️ Download Video";
    link.className = "download-link";
    logEl.appendChild(link);

    const video = document.createElement("video");
    video.src = url; video.controls = true; video.style.width = "100%"; video.style.marginTop = "10px";
    logEl.appendChild(video);

    log("✅ Done!");
  } catch (err) {
    console.error(err);
    log(`❌ ${err.message}`);
  } finally {
    runBtn.disabled = false;
  }
};
</script>
</body>
</html>
