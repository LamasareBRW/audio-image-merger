<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audio Image Merger</title>

<style>
body {
  font-family: system-ui;
  max-width: 720px;
  margin: 20px auto;
  padding: 12px;
}

input, button {
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  font-size: 16px;
}

#progress {
  width: 100%;
  height: 20px;
}
#log {
  white-space: pre-wrap;
  background: #f4f4f4;
  padding: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>Audio + Image → Video (FFmpeg.wasm)</h2>

<input type="file" id="image" accept="image/*">
<input type="file" id="audio" accept="audio/*">

<label>Start Time (seconds)</label>
<input type="number" id="start" placeholder="0">

<label>Duration (seconds)</label>
<input type="number" id="duration" placeholder="optional">

<button id="run">Create Video</button>

<progress id="progress" value="0" max="1"></progress>

<div id="log"></div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const log = (t) => document.getElementById("log").textContent += t + "\n";
const progress = document.getElementById("progress");

const ffmpeg = new FFmpeg();

// CRITICAL FIX: explicitly define core paths (this prevents Android hang)
ffmpeg.on("log", ({ message }) => log(message));

ffmpeg.on("progress", ({ progress: p }) => {
  progress.value = p;
});

async function loadFFmpeg() {
  log("Loading FFmpeg...");

  await ffmpeg.load({
    coreURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js",
    wasmURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm",
    workerURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.worker.js",
  });

  log("FFmpeg loaded.");
}

document.getElementById("run").onclick = async () => {
  const img = document.getElementById("image").files[0];
  const aud = document.getElementById("audio").files[0];

  const start = document.getElementById("start").value;
  const duration = document.getElementById("duration").value;

  if (!img || !aud) {
    alert("Select image and audio");
    return;
  }

  await loadFFmpeg();

  await ffmpeg.writeFile(img.name, await fetchFile(img));
  await ffmpeg.writeFile(aud.name, await fetchFile(aud));

  const args = [
    "-loop", "1",
    "-i", img.name,
    "-ss", start || "0",
    "-i", aud.name,
    "-c:v", "libx264",
    "-pix_fmt", "yuv420p",
    "-c:a", "aac",
    "-b:a", "192k",
    "-shortest"
  ];

  if (duration && Number(duration) > 0) {
    args.push("-t", String(duration));
  }

  args.push("output.mp4");

  log("Processing...");
  await ffmpeg.exec(args);

  const data = await ffmpeg.readFile("output.mp4");

  const url = URL.createObjectURL(
    new Blob([data.buffer], { type: "video/mp4" })
  );

  const a = document.createElement("a");
  a.href = url;
  a.download = "output.mp4";
  a.textContent = "Download Video";
  document.body.appendChild(a);

  log("Done.");
};
</script>

</body>
</html>
